name: Sync TVBox

on:
  schedule:
    # 每天 UTC 0:00 运行，可根据需要调整
    - cron: '0 0 * * 1'
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写入权限才能提交变更

    steps:
      - name: Checkout 当前仓库
        uses: actions/checkout@v4

      - name: 克隆源仓库
        run: |
          git clone --depth 1 https://github.com/qist/tvbox.git /tmp/tvbox-source

      - name: 清理目标目录并复制文件
        run: |
          mkdir -p dist/tvbox
          # 删除旧内容（保留 dist/tvbox 目录本身）
          rm -rf dist/tvbox/*
          # 复制除 .github 和 .gitignore 之外的所有内容
          rsync -av --exclude='.github' --exclude='.gitignore' /tmp/tvbox-source/ dist/tvbox/
          # 移除源仓库的 .git 目录（如果存在）
          rm -rf dist/tvbox/.git

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A dist/tvbox
          # 仅当有变更时才提交
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync tvbox configs from qist/tvbox"
            git push
          else
            echo "无变更，跳过提交"
          fi
